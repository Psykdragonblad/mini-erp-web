name: Front-End CI (Contract & Build Validation)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Front-end
        uses: actions/checkout@v4

      # 1. Baixa o repositório mini-erp-docs para uma pasta temporária
      - name: Checkout do Repositório de Contratos
        uses: actions/checkout@v4
        with:
          repository: 'Psykdragonblad/mini-erp-docs'
          path: temp-docs

      # 2. Copia o openapi.json para o diretório correto do projeto
      - name: Atualizar openapi.json local com a versão mais recente
        run: |
          mkdir -p ./mini-erp-web/src/api
          cp temp-docs/contracts/openapi.json ./mini-erp-web/src/api/openapi.json

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./mini-erp-web/package-lock.json

      - name: Instalar Dependências
        run: npm ci
        working-directory: ./mini-erp-web

      - name: Gerar Cliente OpenAPI (Validação de Contrato)
        run: npm run openapi:generate
        working-directory: ./mini-erp-web

      - name: Compilar o Projeto Angular (Validar Tipagem)
        run: npm run build -- --configuration production
        working-directory: ./mini-erp-web